<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA — 3D Luxury Wearables & Fragrance</title>
  <meta name="description" content="An immersive 3D luxury landing experience showcasing sculpted human wearables, fine eyewear, and haute fragrances.">
  
  <!-- Google Fonts: Cinzel (Display) & Plus Jakarta Sans (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Design Tokens & Styles -->
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/header.css">
  <link rel="stylesheet" href="./src/styles/hero.css">
  <link rel="stylesheet" href="./src/styles/switcher.css">
</head>
<body>

  <!-- Site Navigation Header -->
  <header class="site-header" role="banner">
    <div class="header-container">
      <a href="#hero" class="brand-logo" aria-label="AURA Home">
        <span class="logo-mark">AURA</span>
        <span class="logo-sub">ATELIER</span>
      </a>

      <nav class="nav-links" aria-label="Main Navigation">
        <a href="#hero" class="nav-link active">Edition</a>
        <a href="#collections" class="nav-link">Creations</a>
        <a href="#craftsmanship" class="nav-link">Craftsmanship</a>
      </nav>

      <div class="header-actions">
        <button class="bag-button" id="cart-btn" aria-label="Shopping Bag, 0 items">
          <svg class="bag-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
            <path d="M3 6h18"></path>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="bag-count" id="cart-count" aria-hidden="true">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content">
    <!-- Hero 3D Section -->
    <section class="hero-section" id="hero" aria-label="Hero 3D Showcase">
      <!-- Architectural Typography Behind 3D Model -->
      <div class="hero-backdrop" aria-hidden="true">
        <p class="backdrop-tag">ATELIER MMXXVI EDITION</p>
        <h1 class="backdrop-title">
          SCULPTED FOR<br>
          THE SENSES
        </h1>
        <p class="backdrop-sub">HAUTE WEARABLES • TIMEPIECES • ESSENCE</p>
      </div>

      <!-- 3D WebGL Canvas Viewport in Front of Typography -->
      <div id="webgl-container" aria-label="3D Interactive Luxury Viewport" role="region"></div>

      <!-- Peripheral Corner Controls: Left -->
      <div class="hero-corner-left">
        <div class="corner-badge">
          <span class="corner-dot"></span>
          LIMITED EDITION RUN
        </div>
        <p class="corner-desc">
          Pure metallic geometry engineered for human contours.
        </p>
        <p class="corner-hint">✦ Drag to rotate 360°</p>
      </div>

      <!-- Peripheral Corner Controls: Right -->
      <div class="hero-corner-right">
        <!-- Minimized Material Finish Selector -->
        <div class="variant-selector" role="group" aria-label="Select Material Finish">
          <span class="variant-label">Finish:</span>
          <div class="swatches-list">
            <button class="swatch-btn swatch-gold active" data-finish="gold" aria-label="Obsidian Gold Finish" title="Obsidian Gold"></button>
            <button class="swatch-btn swatch-noir" data-finish="noir" aria-label="Midnight Noir Finish" title="Midnight Noir"></button>
            <button class="swatch-btn swatch-rose" data-finish="rose" aria-label="Champagne Rose Finish" title="Champagne Rose"></button>
          </div>
        </div>

        <a href="#collections" class="btn-explore-link" aria-label="Explore Creations">
          <span>Explore Creations</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </div>

      <!-- Floating 3D Model Switcher Pill Bar -->
      <nav class="model-switcher" aria-label="3D Model Selection">
        <button class="switcher-pill active" data-model="0" aria-label="View Solaris Goggles">01 / SOLARIS</button>
        <button class="switcher-pill" data-model="1" aria-label="View Aura Essence">02 / ESSENCE</button>
        <button class="switcher-pill" data-model="2" aria-label="View Chrono Obsidian">03 / CHRONO</button>
      </nav>
    </section>
  </main>

  <!-- Application Entry Script -->
  <script type="module" src="./src/scripts/main.js"></script>
</body>
</html>
